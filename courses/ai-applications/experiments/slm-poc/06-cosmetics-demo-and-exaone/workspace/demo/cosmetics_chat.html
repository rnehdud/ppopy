<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Skin Chat</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f4f4;color:#212121}main{height:100dvh;max-width:540px;margin:auto;display:flex;flex-direction:column;background:#aabdd1;box-shadow:0 0 28px #0000000c}header{background:#f9f9f9;padding:17px 20px;font-weight:700;text-align:center;border-bottom:1px solid #e5e5e5}#messages{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:82%;padding:11px 14px;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:15px;box-shadow:0 1px 2px #00000012}.assistant{align-self:flex-start;background:white;border-top-left-radius:4px}.user{align-self:flex-end;background:#ffeb55;border-top-right-radius:4px}.trace{align-self:flex-start;max-width:88%;margin:-7px 0 3px 3px;font-size:11px;line-height:1.45;color:#4a5f73;opacity:.82;white-space:pre-wrap;overflow-wrap:anywhere}form{background:#fafafa;padding:12px;display:flex;align-items:end;gap:8px;border-top:1px solid #e3e3e3;padding-bottom:max(12px,env(safe-area-inset-bottom))}textarea{flex:1;resize:none;min-height:43px;max-height:100px;padding:10px 12px;border:1px solid #d7d7d7;border-radius:10px;background:#fff;font:inherit;line-height:1.4}button{height:43px;padding:0 17px;border:0;border-radius:10px;background:#ffdf38;color:#292714;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:default}
</style></head><body><main><header>Skin Chat</header><div id="messages" role="log" aria-live="polite"><div class="bubble assistant">안녕하세요! 지금 피부 상태를 한국어로 말씀해 주세요.</div></div><form id="form"><textarea id="input" rows="1" maxlength="400" aria-label="메시지" placeholder="메시지 입력" required></textarea><button id="send" type="submit" disabled>전송</button></form></main>
<script>
const TOKEN='__CSRF__',SESSION='__SESSION__';const messages=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send');let ready=false,busy=false;
function add(role,text){const div=document.createElement('div');div.className='bubble '+role;div.textContent=text;messages.append(div);messages.scrollTop=messages.scrollHeight;return div}
function showTrace(debug){if(!debug)return;const action={record:'기록',show:'기록 조회',ask:'확인 질문',none:'사용 안 함'};const op={state_update:'상태 업데이트',no_state_update:'변경 없음',state_read:'상태 조회',tool_call:'도구 호출',none:'실행 없음'};const fields={dryness:'건조함',breakout:'뾰루지',redness:'붉어짐',stinging:'따가움',itching:'가려움'};const values={present:'있음',absent:'없음',unknown:'모름'};const tools={record_skin_symptoms:'피부 상태 기록',read_skin_record:'피부 기록 조회'};const toolName=name=>tools[name]?tools[name]+' ('+name+')':name;const stop={single_action:'1회 작업 후 종료 (자동 연속 실행 없음)',no_tool_chosen:'도구를 선택하지 않고 종료',model_stop:'모델이 종료 선택',condition_not_met:'실행 조건을 충족하지 않아 중단',duplicate_call:'중복 작업 방지로 중단 · 미완료',step_limit:'작업 횟수 한도 도달 · 미완료',input_limit:'입력 길이 한도 도달 · 미완료',tool_error:'도구 처리 실패로 중단',handler_error:'처리 오류 · 재실행 없음',no_registered_tools:'연결된 도구 없음'};let parts=['처리: '+(op[debug.operation]||debug.operation)];if(debug.steps){parts.push('도구: '+(debug.steps.filter(s=>s.tool).map(s=>toolName(s.tool)+(s.ok?' ✓':' ×')).join(' → ')||'실행 없음'));const blocked=debug.steps.filter(s=>s.proposed!==s.selected);if(blocked.length)parts.push('실행 보류: '+blocked.map(s=>toolName(s.proposed)).join(', '))}else{parts.unshift('판단: '+(action[debug.selected_action]||debug.selected_action))}if(debug.changes&&debug.changes.length)parts.push('변경: '+debug.changes.map(c=>(fields[c.field]||c.field)+' '+(values[c.before]||c.before)+'→'+(values[c.after]||c.after)).join(', '));if(debug.stop_reason)parts.push(stop[debug.stop_reason]||debug.stop_reason);parts.push('응답: '+(debug.reply_source==='qwen'?'Qwen':'정해진 문구'));const el=document.createElement('div');el.className='trace';el.textContent=parts.join(' · ');messages.append(el);messages.scrollTop=messages.scrollHeight}
async function waitModel(){try{let r=await fetch('/api/status');let d=await r.json();if(d.status==='ready'){ready=true;send.disabled=false;messages.firstElementChild.textContent=d.reply_status==='unavailable'?'답변 모델에 연결하지 못했어요. 간단한 기록은 할 수 있어요.':'안녕하세요! 지금 피부 상태를 한국어로 말씀해 주세요.';return}if(d.status==='error'){add('assistant','모델을 시작할 수 없어요. 프로그램을 다시 실행해 주세요.');return}}catch(e){}setTimeout(waitModel,1500)}waitModel();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let text=input.value.trim();if(!text||busy||!ready)return;busy=true;send.disabled=true;input.value='';add('user',text);let wait=add('assistant','...');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Chat-Token':TOKEN},body:JSON.stringify({session:SESSION,text})});let d=await r.json();if(!r.ok)throw new Error(d.error||'error');wait.textContent=d.reply;showTrace(d.debug)}catch(e){wait.textContent='처리하지 못했어요. 다시 시도해 주세요.'}finally{busy=false;send.disabled=false;messages.scrollTop=messages.scrollHeight;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('form').requestSubmit()}});
</script></body></html>

[project]
name = "beautylife-agent"
version = "0.1.0"
description = "Synthetic-first shared cosmetics agent prototype"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "kiwipiepy>=0.18,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
rl = [
    "gymnasium==1.2.3",
    "numpy>=1.24,<3",
]
rl-train = [
    {include-group = "rl"},
    "torch==2.9.1",
    "stable-baselines3==2.7.1",
    "sb3-contrib==2.7.1",
]
tracking = [
    "matplotlib>=3.8,<4",
    "mlflow==3.6.0",
]

[tool.uv.dependency-groups]
rl-train = {requires-python = ">=3.10,<3.14"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Base discovery excludes optional suites; use -o norecursedirs= for the full suite.
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "node_modules", "gym", "ppo", "tracking"]
